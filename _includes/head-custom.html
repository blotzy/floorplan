<!-- Tap/click any image to open it full screen: pinch or scroll to zoom, drag to pan,
     double-tap to zoom in/out, ✕ / Esc / tap outside to close. -->
<style>
  .markdown-body img { cursor: zoom-in; }
  #zoombox { position: fixed; inset: 0; z-index: 1000; display: none; overflow: hidden;
             background: rgba(18, 22, 26, .95); touch-action: none; }
  #zoombox.open { display: flex; align-items: center; justify-content: center; }
  #zoombox img { max-width: 100vw; max-height: 100vh; cursor: grab; user-select: none; -webkit-user-drag: none; }
  #zoombox button { position: absolute; top: 12px; right: 12px; z-index: 2; width: 44px; height: 44px;
                    border: 0; border-radius: 22px; background: #fffe; font-size: 22px; line-height: 44px; cursor: pointer; }
  #zoombox .hint { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 2;
                   padding: 6px 12px; border-radius: 8px; background: #fffd; font: 13px system-ui, sans-serif;
                   white-space: nowrap; pointer-events: none; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@4.5.1/dist/panzoom.min.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const box = document.createElement('div');
  box.id = 'zoombox';
  box.innerHTML = '<button aria-label="Close">✕</button><img alt=""><div class="hint"></div>';
  document.body.appendChild(box);
  const big = box.querySelector('img'), hint = box.querySelector('.hint');
  const touch = matchMedia('(pointer: coarse)').matches;
  hint.textContent = touch ? 'Pinch to zoom · drag to move · double-tap to zoom · ✕ to close'
                           : 'Scroll to zoom · drag to move · double-click to zoom · Esc to close';
  let pz = null, moved = false;

  function open(src, alt) {
    big.src = src; big.alt = alt || '';
    box.classList.add('open');
    document.documentElement.style.overflow = 'hidden';
    if (!pz) {
      pz = Panzoom(big, { maxScale: 10, minScale: 1, step: 0.4, cursor: 'grab' });
      box.addEventListener('wheel', e => { e.preventDefault(); pz.zoomWithWheel(e); }, { passive: false });
      big.addEventListener('panzoomchange', () => { moved = true; });
      big.addEventListener('dblclick', e => {
        if (pz.getScale() > 1.5) pz.reset(); else pz.zoomToPoint(3, e);
      });
    }
    pz.reset({ animate: false });
  }
  function close() {
    box.classList.remove('open');
    document.documentElement.style.overflow = '';
  }

  document.querySelectorAll('.markdown-body img').forEach(img => {
    img.addEventListener('click', e => {
      e.preventDefault();
      open(img.currentSrc || img.src, img.alt);
    });
  });
  box.querySelector('button').addEventListener('click', close);
  box.addEventListener('pointerdown', () => { moved = false; });
  box.addEventListener('click', e => { if (e.target === box && !moved) close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  if (location.hash === '#zoomtest') open(document.querySelector('.markdown-body img').src);   // test hook
});
</script>
